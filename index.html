<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Licznik kilokalorii</title>

<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#efede7; --line:#dedbd2;
  --text:#1d1c1a; --muted:#6c6a63; --accent:#2f6f4f; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --over:#c0392b; --over-soft:#f7dcd8; --near:#b7791f; --near-soft:#f6e8cc;
  --under:#3b6ea5; --under-soft:#dce7f3; --ok:#2f7d4f; --ok-soft:#d8eee0;
  --planned:#9a978e;
  --c-carbs:#c98a2b; --c-protein:#3b6ea5; --c-fat:#a8526a; --c-kcal:#2f6f4f;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1e1d1b; --surface2:#282724; --line:#35332f;
    --text:#ecebe6; --muted:#a09d95; --accent:#5fb487; --accent-ink:#0f1a14; --accent-soft:#1f3a2c;
    --over:#ef6f5e; --over-soft:#43231f; --near:#e0a64a; --near-soft:#3d3020;
    --under:#78a6db; --under-soft:#1e2d40; --ok:#62c08a; --ok-soft:#1c3527;
    --planned:#6d6a63;
    --c-carbs:#e0a64a; --c-protein:#78a6db; --c-fat:#d58aa0; --c-kcal:#5fb487;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1d1b; --surface2:#282724; --line:#35332f;
  --text:#ecebe6; --muted:#a09d95; --accent:#5fb487; --accent-ink:#0f1a14; --accent-soft:#1f3a2c;
  --over:#ef6f5e; --over-soft:#43231f; --near:#e0a64a; --near-soft:#3d3020;
  --under:#78a6db; --under-soft:#1e2d40; --ok:#62c08a; --ok-soft:#1c3527;
  --planned:#6d6a63;
  --c-carbs:#e0a64a; --c-protein:#78a6db; --c-fat:#d58aa0; --c-kcal:#5fb487;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
#app{max-width:680px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.viewing{font-size:13px;background:var(--near-soft);color:var(--near);padding:6px 10px;border-radius:10px;margin-top:8px}
.datebar{display:flex;align-items:center;gap:6px;margin-top:8px}
.datebtn{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600;text-align:center}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.iconbtn.plain{background:transparent;border-color:transparent}
.iconbtn svg,.btn svg{width:20px;height:20px}
.todaybtn{font-size:14px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 4px}
.section-h h3{margin:0;font-size:15px;font-weight:700}
.section-h .meta{font-size:13px;color:var(--muted)}

/* summary */
.kcal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kcal-big{font-size:32px;font-weight:750;letter-spacing:-.02em}
.kcal-goal{color:var(--muted);font-size:14px}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar>.plan{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--planned) 0 4px,transparent 4px 8px);opacity:.8}
.bar>.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.macro .val{font-weight:650;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend .sw{width:14px;height:8px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.alerts{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.alert{font-size:14px;padding:8px 10px;border-radius:10px;display:flex;gap:8px;align-items:flex-start}
.alert.over{background:var(--over-soft);color:var(--over)}
.alert.near,.alert.planover{background:var(--near-soft);color:var(--near)}
.alert.under{background:var(--under-soft);color:var(--under)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.nrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.nrow:last-child{border-bottom:0}
.nrow .bar{grid-column:1/-1;height:6px;margin-top:4px}
.nrow.sub{padding-left:14px}
.nrow .st-over{color:var(--over);font-weight:600}
.nrow .st-near{color:var(--near);font-weight:600}
.nrow .st-under{color:var(--under)}
.nrow .st-ok{color:var(--ok)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}

/* meals */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:8px;overflow:hidden}
.meal.planned{border-style:dashed;background:transparent}
.meal-main{display:flex;align-items:center;gap:10px;padding:12px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px}
.meal-title{font-weight:600}
.meal-sub{font-size:13px;color:var(--muted);margin-top:2px}
.meal-kcal{font-weight:700;text-align:right;white-space:nowrap}
.meal-kcal small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.meal-items{border-top:1px solid var(--line);padding:6px 12px 10px;font-size:14px}
.meal-items .it{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.meal-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.plan{background:var(--near-soft);color:var(--near)}
.tag.shared{background:var(--accent-soft);color:var(--accent)}
.tag.approx{background:var(--under-soft);color:var(--under)}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--over)}
.btn.small{min-height:34px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:30}
.fab svg{width:28px;height:28px}
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea.inp{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ngrid label.f{margin-top:8px}
.ngrid label.f.sub>span{padding-left:10px}
.unit-inp{position:relative}
.unit-inp .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.unit-inp .inp{padding-right:40px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.calc{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px}
.calc b{font-size:16px}
.fieldset-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 2px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.sw-t{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw-t:checked{background:var(--accent)}
.sw-t:checked::after{transform:translateX(18px)}

/* list */
.list-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .t{font-weight:600}
.list-item .s{font-size:13px;color:var(--muted)}
button.list-item{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:25}
.nav-in{display:flex;max-width:680px;width:100%}
.nav button{flex:1;background:none;border:0;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg);border-radius:0}
.sheet-f .btn{flex:1}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:18px;max-height:88vh}}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.cal-h b{font-size:16px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.cal button{aspect-ratio:1/1;border:1px solid transparent;background:var(--surface);border-radius:10px;font-weight:600;font-size:15px;position:relative;padding:0}
.cal button.out{visibility:hidden}
.cal button.today{border-color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal button .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.cal button .dots i{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.cal button .dots i.p{background:transparent;border:1.5px solid var(--near);width:6px;height:6px}
.cal button.sel .dots i{background:var(--accent-ink)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:100;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--over);color:#fff}

/* auth */
.auth{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 16px 40px}
.auth h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.lang-switch{display:flex;gap:6px;justify-content:flex-end;margin-bottom:24px}
.lang-switch button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px}
.lang-switch button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.err-box{background:var(--over-soft);color:var(--over);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}
.info-box{background:var(--under-soft);color:var(--under);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
video.scan{width:100%;border-radius:12px;background:#000;margin-top:10px;max-height:260px;object-fit:cover}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:5px}

</style>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function parseNum(v){
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).trim().replace(/\s/g,'').replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function isNum(v){ return typeof v === 'number' && isFinite(v); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function pad(n){ return String(n).padStart(2,'0'); }
function isoDay(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

// Mnożnik: ile "baz" (100 g / 100 ml / sztuk) zawiera wpisana ilość
function itemFactor(it){
  const a = parseNum(it.amount);
  const pg = parseNum(it.piece_g);
  switch (it.basis){
    case 'total': return 1;
    case 'piece':
      if (a === null) return 0;
      if (it.unit === 'pc') return a;
      return pg ? a / pg : 0;               // gramy przy bazie "sztuka"
    default: // 100g / 100ml
      if (a === null) return 0;
      if (it.unit === 'pc') return pg ? a * pg / 100 : 0;
      return a / 100;
  }
}
// kcal dla bazy: wpisane albo wyliczone (UE: 4/4/9, alkohol 7, błonnik 2)
function baseKcal(n){
  if (isNum(n.kcal)) return {v:n.kcal, calc:false};
  const c = parseNum(n.carbs), p = parseNum(n.protein), f = parseNum(n.fat);
  if (c === null && p === null && f === null) return {v:null, calc:false};
  const v = 4*(c||0) + 4*(p||0) + 9*(f||0) + 7*(parseNum(n.alcohol)||0) + 2*(parseNum(n.fiber)||0);
  return {v, calc:true};
}
function itemTotals(it){
  const f = itemFactor(it), n = it.n || {}, out = {};
  for (const k of Object.keys(n)){
    const v = parseNum(n[k]);
    if (v !== null) out[k] = v * f;
  }
  const bk = baseKcal(n);
  if (bk.v !== null) out.kcal = bk.v * f;
  return out;
}
function sumInto(acc, t){ for (const k in t){ acc[k] = (acc[k]||0) + t[k]; } return acc; }
function mealTotals(m){ return (m.items||[]).reduce((a, it) => sumInto(a, itemTotals(it)), {}); }
function dayTotals(meals, status){
  return meals.filter(m => !status || m.status === status).reduce((a,m) => sumInto(a, mealTotals(m)), {});
}
// Ocena celu: 'over' | 'near' | 'under' | 'ok' | null
function goalState(v, g){
  if (!g || !g.mode) return null;
  v = v || 0;
  const min = parseNum(g.min), max = parseNum(g.max);
  if ((g.mode === 'max' || g.mode === 'range') && max !== null){
    if (v > max) return 'over';
  }
  if ((g.mode === 'min' || g.mode === 'range') && min !== null){
    if (v < min) return 'under';
  }
  if (g.mode === 'max' && max !== null && v >= 0.9*max) return 'near';
  if ((g.mode === 'max' && max !== null) || (g.mode === 'min' && min !== null) || (g.mode === 'range' && (min !== null || max !== null))) return 'ok';
  return null;
}
function goalTarget(g){
  if (!g) return null;
  const min = parseNum(g.min), max = parseNum(g.max);
  if (g.mode === 'max') return max;
  if (g.mode === 'min') return min;
  if (g.mode === 'range') return max ?? min;
  return null;
}

  kcal:['kcal','energy','energia','energie','kalorie','calories','energy_kcal'],
  carbs:['carbs','carbohydrates','weglowodany','węglowodany','kohlenhydrate'],

};
function extractJson(text){
  if (!text) throw new Error('empty');
  let s = String(text).replace(/```(?:json)?/gi, '').trim();
  const iObj = s.indexOf('{'), iArr = s.indexOf('[');
  let start = -1, open, close;
  if (iArr !== -1 && (iObj === -1 || iArr < iObj)){ start = iArr; open = '['; close = ']'; }
  else if (iObj !== -1){ start = iObj; open = '{'; close = '}'; }
  if (start === -1) throw new Error('nojson');
  const end = s.lastIndexOf(close);
  if (end <= start) throw new Error('nojson');
  s = s.slice(start, end+1);
  s = s.replace(/,\s*([}\]])/g, '$1');   // przecinki na końcu
  return JSON.parse(s);
}
function normalizeAiFood(o, customList){
  if (!o || typeof o !== 'object') return null;
  const src = (o.n && typeof o.n === 'object') ? o.n : (o.nutrients && typeof o.nutrients === 'object' ? o.nutrients : o);
  const n = {};
  const lowerMap = {};
  for (const k of Object.keys(src)) lowerMap[k.toLowerCase()] = src[k];
  for (const nd of NUTRIENTS){
    let v = src[nd.k];
    if (v === undefined){
      const al = AI_ALIASES[nd.k] || [nd.k.toLowerCase()];
      for (const a of al){ if (lowerMap[a] !== undefined){ v = lowerMap[a]; break; } }
    }
    const pv = parseNum(v);
    if (pv !== null) n[nd.k] = pv;
  }
  for (const c of (customList||[])){
    const v = parseNum(src[c.k] ?? lowerMap[String(c.name||'').toLowerCase()]);
    if (v !== null) n[c.k] = v;
  }
  let basis = String(o.basis || o.per || '100g').toLowerCase().replace(/\s/g,'');
  if (['100ml','ml'].includes(basis)) basis = '100ml';
  else if (['piece','sztuka','szt','stück','stueck','portion','porcja','serving','tablet','tabletka'].includes(basis)) basis = 'piece';
  else basis = '100g';
  const amount = parseNum(o.amount ?? o.grams ?? o.ilosc);
  return {
    name: String(o.name || o.nazwa || '').trim(),
    brand: String(o.brand || o.marka || '').trim(),
    basis, piece_g: parseNum(o.piece_g ?? o.serving_g),
    amount, n
  };
}

const OFF = {
  fields: 'code,product_name,product_name_pl,product_name_de,product_name_en,generic_name,brands,quantity,serving_quantity,nutriments',
  host(cc){ return cc && cc !== 'world' ? `https://${cc}.openfoodfacts.org` : 'https://world.openfoodfacts.org'; },
  async search(q, lang, cc){
    const url = `${this.host(cc)}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&lc=${lang}&fields=${this.fields}`;
    const r = await fetch(url);
    if (r.status === 429) throw new Error('rate');
    if (!r.ok) throw new Error('http '+r.status);
    const j = await r.json();
    return (j.products || []).map(p => this.toFood(p, lang)).filter(Boolean);
  },
  async byCode(code, lang){
    const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${this.fields}&lc=${lang}`;
    const r = await fetch(url);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('http '+r.status);
    const j = await r.json();
    if (!j || j.status === 0 || !j.product) return null;
    return this.toFood({...j.product, code: j.code || code}, lang);
  },
  toFood(p, lang){
    if (!p) return null;
    const nm = p.nutriments || {};
    const n = {};
    for (const nd of NUTRIENTS){
      if (!nd.off) continue;
      const v = parseNum(nm[nd.off + '_100g']);
      if (v !== null) n[nd.k] = +(v * (nd.offMul || 1)).toFixed(4);
    }
    if (!isNum(n.kcal)){
      const kj = parseNum(nm['energy-kj_100g']) ?? (nm['energy_unit'] === 'kJ' ? parseNum(nm['energy_100g']) : null);
      if (kj !== null) n.kcal = +(kj / 4.184).toFixed(1);
    }
    if (!isNum(n.salt) && isNum(parseNum(nm['sodium_100g']))) n.salt = +(parseNum(nm['sodium_100g']) * 2.5).toFixed(3);
    const alc = parseNum(nm['alcohol_100g']);   // % obj.
    if (alc) n.alcohol = +(alc * 0.789).toFixed(2);
    const q = String(p.quantity || '').toLowerCase();
    const liquid = /\d\s*(ml|cl|l)\b/.test(q);
    const name = p['product_name_'+lang] || p.product_name || p.product_name_pl || p.product_name_de || p.product_name_en || p.generic_name || '';
    if (!name && !Object.keys(n).length) return null;
    return {
      name: name.trim(), brand: String(p.brands || '').split(',')[0].trim(),
      barcode: p.code || null, source: 'off',
      basis: liquid ? '100ml' : '100g',
      piece_g: parseNum(p.serving_quantity),
      quantity: p.quantity || '', n
    };
  }
};

/* =====================================================================
   Backend: Supabase
   ===================================================================== */
class SupabaseApi {
  constructor(url, key){
    const h = new URLSearchParams(location.hash.slice(1));
    this.linkType = h.get('type');          // 'invite' | 'recovery' | null
    this.sb = window.supabase.createClient(url, key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    this.demo = false;
  }
  _t(q){ return q.then(({data, error}) => { if (error) throw error; return data; }); }
  async _all(query){
    const rows = [];
    for (;;){
      const page = await this._t(query().range(rows.length, rows.length + 499));
      if (!page || !page.length) return rows;
      rows.push(...page);
    }
  }
  async session(){ const {data} = await this.sb.auth.getSession(); return data.session ? {id:data.session.user.id, email:data.session.user.email} : null; }
  onAuth(cb){ this.sb.auth.onAuthStateChange((ev, s) => cb(ev, s ? {id:s.user.id, email:s.user.email} : null)); }
  async signIn(email, password){ const {error} = await this.sb.auth.signInWithPassword({email, password}); if (error) throw error; }
  async signOut(){ await this.sb.auth.signOut(); }
  async resetPassword(email){ const {error} = await this.sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname}); if (error) throw error; }
  async updatePassword(pw){ const {error} = await this.sb.auth.updateUser({password: pw}); if (error) throw error; }
  async getProfile(id){ return this._t(this.sb.from('profiles').select('*').eq('id', id).maybeSingle()); }
  async updateProfile(id, patch){ return this._t(this.sb.from('profiles').update(patch).eq('id', id).select().single()); }
  async listProfiles(){ return this._all(() => this.sb.from('profiles').select('id,email,display_name,is_admin,settings').order('display_name').order('id')); }
  async listMeals(userId, from, to){
    return this._all(() => this.sb.from('meals').select('*').eq('user_id', userId).gte('day', from).lte('day', to).order('position').order('created_at').order('id'));
  }
  async monthMarks(userId, from, to){
    return this._all(() => this.sb.from('meals').select('day,status').eq('user_id', userId).gte('day', from).lte('day', to).order('day').order('id'));
  }
  async insertMeal(m){ return this._t(this.sb.from('meals').insert(m).select().single()); }
  async insertMeals(ms){ return this._t(this.sb.from('meals').insert(ms).select()); }
  async updateMeal(id, patch){ return this._t(this.sb.from('meals').update(patch).eq('id', id).select().single()); }
  async deleteMeal(id){ return this._t(this.sb.from('meals').delete().eq('id', id)); }
  async listFoods(){ return this._all(() => this.sb.from('foods').select('*').order('name').order('id')); }
  async insertFood(f){ return this._t(this.sb.from('foods').insert(f).select().single()); }
  async updateFood(id, patch){ return this._t(this.sb.from('foods').update(patch).eq('id', id).select().single()); }
  async deleteFood(id){ return this._t(this.sb.from('foods').delete().eq('id', id)); }
  async allMeals(userId){ return this._all(() => this.sb.from('meals').select('*').eq('user_id', userId).order('day').order('id')); }
}

const LOCALES = {pl:'pl-PL', de:'de-DE', en:'en-GB'};

function t(key, vars){
  let s = (I18N[S.lang] && I18N[S.lang][key]) ?? I18N.pl[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function nName(k, settings){
  if (NUT_BY_KEY[k]) return t('n_'+k);
  const c = (settings || S.settings).custom.find(c => c.k === k) || (S.viewSettings && S.viewSettings.custom.find(c => c.k === k));
  return c ? c.name : k;
}
function nUnit(k, settings){
  if (NUT_BY_KEY[k]) return NUT_BY_KEY[k].u;
  const c = (settings || S.settings).custom.find(c => c.k === k) || (S.viewSettings && S.viewSettings.custom.find(c => c.k === k));
  return c ? c.unit : '';
}
function fmt(v, digits){
  if (!isNum(v)) return '–';
  if (digits === undefined){
    const a = Math.abs(v);
    digits = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 1 : a === 0 ? 0 : 2;
  }
  return new Intl.NumberFormat(LOCALES[S.lang], {maximumFractionDigits:digits, minimumFractionDigits:0}).format(v);
}
function fmtN(v, k, settings){
  if (k === 'kcal') return fmt(v, 0);
  return fmt(v);
}
function inputNum(v){
  if (!isNum(v)) return '';
  const s = String(+v.toFixed(4));
  return S.lang === 'en' ? s : s.replace('.', ',');
}
function fmtDate(iso, opts){
  return new Intl.DateTimeFormat(LOCALES[S.lang], opts || {weekday:'long', day:'numeric', month:'long'}).format(parseDay(iso));
}
function mealTypeName(id, settings){
  const mt = (settings || S.settings).mealTypes.find(m => m.id === id);
  if (mt && mt.name) return mt.name;
  const key = 'meal_'+id;
  return (I18N.pl[key] ? t(key) : (mt ? mt.id : id));
}
function unitLabel(u){ return u === 'pc' ? t('unit_pc') : u; }
function basisLabel(b){ return t('basis_'+b); }

// Składniki widoczne dla danych ustawień (core + śledzone + własne śledzone)
function visibleNutrients(settings){
  settings = settings || S.settings;
  const out = [...CORE];
  for (const n of NUTRIENTS) if (!CORE.includes(n.k) && settings.tracked.includes(n.k)) out.push(n.k);
  for (const c of settings.custom) if (settings.tracked.includes(c.k)) out.push(c.k);
  return out;
}
function allNutrientKeys(settings){
  settings = settings || S.settings;
  return [...NUTRIENTS.map(n => n.k), ...settings.custom.map(c => c.k)];
}
function applyTheme(){
  const th = S.settings.theme || 'auto';
  if (th === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', th);
  document.documentElement.lang = S.lang;
}
function normalizeText(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l'); }

let toastTimer;
function toast(msg, err){
  let el = $('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.toggle('err', !!err); el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', err ? 5000 : 2200);
}
function errMsg(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login/i.test(m)) return t('err_login');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return t('err_network');
  return m;
}
const sheets = [];
function openSheet({title, body, footer, onClose, cls}){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet ${cls||''}" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2>${esc(title)}</h2><button class="iconbtn plain" data-close aria-label="${esc(t('close'))}">${IC.close}</button></div>
    <div class="sheet-b"></div>${footer !== false ? '<div class="sheet-f"></div>' : ''}</div>`;
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  const api = {
    el: wrap, body: $('.sheet-b', wrap), foot: $('.sheet-f', wrap),
    close(){
      wrap.remove(); sheets.splice(sheets.indexOf(api), 1);
      if (!sheets.length) document.body.style.overflow = '';
      onClose && onClose();
    },
    setTitle(s){ $('.sheet-h h2', wrap).textContent = s; }
  };
  if (typeof body === 'string') api.body.innerHTML = body; else if (body) api.body.appendChild(body);
  $('[data-close]', wrap).onclick = () => api.close();
  wrap.addEventListener('click', e => { if (e.target === wrap) api.close(); });
  sheets.push(api);
  return api;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) sheets[sheets.length-1].close(); });

function askConfirm(text, okLabel, danger){
  return new Promise(res => {
    let done = false;
    const sh = openSheet({title: t('confirm'), body: `<p>${esc(text)}</p>`, onClose: () => { if (!done) res(false); }});
    sh.foot.innerHTML = `<button class="btn" data-no>${esc(t('cancel'))}</button><button class="btn ${danger?'danger':'primary'}" data-yes>${esc(okLabel || t('ok'))}</button>`;
    $('[data-no]', sh.foot).onclick = () => { done = true; res(false); sh.close(); };
    $('[data-yes]', sh.foot).onclick = () => { done = true; res(true); sh.close(); };
  });
}

async function boot(){
  const params = new URLSearchParams(location.search);
  const wantDemo = params.has('demo');
  try { S.lang = localStorage.getItem('lk_lang') || 'pl'; } catch(e){ S.lang = 'pl'; }
  applyTheme();
  if (wantDemo){
    S.api = new DemoApi();
  } else if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
    S.api = new SupabaseApi(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  } else {
    return renderSetupMissing(!window.supabase && CONFIG.SUPABASE_URL);
  }
  S.api.onAuth(async (ev, user) => {
    if (ev === 'PASSWORD_RECOVERY'){ S.me = user; return renderSetPassword(); }
    if (ev === 'SIGNED_OUT'){ S.me = null; renderLogin(); }
  });
  const sess = await S.api.session();
  if (sess && (S.api.linkType === 'invite' || S.api.linkType === 'recovery')){
    S.me = sess; history.replaceState(null, '', location.pathname + location.search);
    return renderSetPassword();
  }
  if (sess){ S.me = sess; await afterLogin(); }
  else renderLogin();
}

function renderDay(){
  const v = $('#view');
  const st = S.viewSettings || S.settings;
  const eaten = dayTotals(S.meals, 'eaten');
  const planned = dayTotals(S.meals, 'planned');
  const all = sumInto(sumInto({}, eaten), planned);
  let html = summaryCard(eaten, planned, all, st);
  const types = st.mealTypes.map(m => m.id);
  const extraTypes = [...new Set(S.meals.map(m => m.meal_type))].filter(x => !types.includes(x));
  for (const type of [...types, ...extraTypes]){
    const ms = S.meals.filter(m => m.meal_type === type);
    const kc = ms.reduce((a, m) => a + (mealTotals(m).kcal || 0), 0);
    html += `<div class="section-h"><h3>${esc(mealTypeName(type, st))}</h3>
      <div class="row"><span class="meta num">${ms.length ? esc(fmt(kc,0))+' kcal' : ''}</span>
      ${readOnly() ? '' : `<button class="iconbtn plain" data-add="${esc(type)}" aria-label="${esc(t('add_meal'))}" style="height:34px;min-width:34px">${IC.plus}</button>`}</div></div>`;
    if (!ms.length) html += `<div class="empty">${esc(t('no_meals'))}</div>`;
    for (const m of ms) html += mealCard(m);
  }
  v.innerHTML = html;
  bindSummary(v);
  $$('[data-add]', v).forEach(b => b.onclick = () => openMealEditor(null, b.dataset.add));
  $$('.meal', v).forEach(el => bindMealCard(el));
}

function summaryCard(E, P, A, st){
  const goals = st.goals || {};
  const kg = goals.kcal;
  const kTarget = goalTarget(kg);
  const kState = goalState(E.kcal, kg);
  const scale = Math.max(kTarget ? kTarget * 1.1 : 0, A.kcal || 0, 1);
  const colorFor = s => s === 'over' ? 'var(--over)' : s === 'near' ? 'var(--near)' : 'var(--c-kcal)';
  const bar = (e, a, target, sc, color, mini) => {
    const ew = Math.min(100, (e||0) / sc * 100), aw = Math.min(100, (a||0) / sc * 100);
    return `<div class="bar" ${mini?'style="height:6px;margin-top:5px"':''}><div class="fill" style="width:${ew}%;background:${color}"></div>
      ${aw > ew ? `<div class="plan" style="left:${ew}%;width:${aw-ew}%"></div>` : ''}
      ${target ? `<div class="mark" style="left:${Math.min(100, target/sc*100)}%"></div>` : ''}</div>`;
  };
  let h = `<div class="card" id="summary">
    <div class="kcal-head"><div><span class="kcal-big num">${esc(fmt(E.kcal||0,0))}</span> <span class="muted">kcal</span></div>
      <div class="kcal-goal num">${kTarget ? esc(t('goal'))+' '+esc(fmt(kTarget,0)) : `<button class="linkbtn" data-act="set-goals">${esc(t('set_goal'))}</button>`}</div></div>
    ${bar(E.kcal, A.kcal, kTarget, scale, colorFor(kState))}`;
  if ((P.kcal||0) > 0) h += `<div class="small muted" style="margin-top:6px">${esc(t('planned_plus', {p: fmt(P.kcal,0), a: fmt(A.kcal,0)}))}</div>`;
  h += `<div class="macros">`;
  const mcol = {carbs:'var(--c-carbs)', protein:'var(--c-protein)', fat:'var(--c-fat)'};
  for (const k of ['carbs','protein','fat']){
    const g = goals[k], tg = goalTarget(g), s = goalState(E[k], g);
    const sc = Math.max(tg ? tg*1.1 : 0, A[k]||0, 1);
    h += `<div class="macro"><div class="lbl"><span class="dot" style="background:${mcol[k]}"></span>${esc(t('n_'+k))}</div>
      <div class="val num ${s==='over'?'st-over':''}" style="${s==='over'?'color:var(--over)':''}">${esc(fmt(E[k]||0,0))}${tg ? `<span class="muted" style="font-weight:400"> / ${esc(fmt(tg,0))}</span>` : ''} g</div>
      ${bar(E[k], A[k], tg, sc, s==='over'?'var(--over)':mcol[k], true)}</div>`;
  }
  h += `</div>`;
  if ((P.kcal||0) > 0) h += `<div class="legend"><span><i class="sw" style="background:var(--c-kcal)"></i>${esc(t('eaten'))}</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--planned) 0 3px,transparent 3px 6px)"></i>${esc(t('planned'))}</span></div>`;
  // Alerty
  const keys = visibleNutrients(st);
  const over = [], planOver = [], under = [];
  for (const k of keys){
    const g = goals[k]; if (!g || !g.mode) continue;
    const sE = goalState(E[k], g), sA = goalState(A[k], g);
    const max = parseNum(g.max), min = parseNum(g.min);
    if (sE === 'over') over.push(`${nName(k, st)} ${fmtN(E[k], k)} / ${fmtN(max, k)} ${nUnit(k, st)} (+${fmtN((E[k]||0) - max, k)})`);
    else if (sA === 'over') planOver.push(`${nName(k, st)} ${fmtN(A[k], k)} / ${fmtN(max, k)} ${nUnit(k, st)}`);
    if (sA === 'under' && min !== null) under.push(`${S.lang === 'de' ? nName(k, st) : nName(k, st).toLowerCase()} ${fmtN(min - (A[k]||0), k)} ${nUnit(k, st)}`);
  }
  if (over.length || planOver.length || under.length){
    h += `<div class="alerts">`;
    if (over.length) h += `<div class="alert over"><b>!</b><div>${esc(t('alert_over'))}: ${esc(over.join('; '))}</div></div>`;
    if (planOver.length) h += `<div class="alert planover"><b>!</b><div>${esc(t('alert_planover'))}: ${esc(planOver.join('; '))}</div></div>`;
    if (under.length) h += `<div class="alert under"><div>${esc(t('alert_under'))}: ${esc(under.join(', '))}</div></div>`;
    h += `</div>`;
  }
  const extra = keys.filter(k => !['kcal','carbs','protein','fat'].includes(k));
  h += `<button class="linkbtn" data-act="toggle-details">${esc(S.showDetails ? t('hide_details') : t('show_details'))}</button>`;
  if (S.showDetails){
    h += `<div class="details">`;
    for (const k of keys){
      const g = goals[k], tg = goalTarget(g), s = goalState(E[k], g);
      const nd = NUT_BY_KEY[k];
      const sc = Math.max(tg ? tg*1.1 : 0, A[k]||0, 1e-9);
      const col = s==='over'?'var(--over)':s==='near'?'var(--near)':s==='ok'?'var(--ok)':'var(--under)';
      const goalTxt = g && g.mode ? (g.mode==='max' ? '≤ '+fmtN(parseNum(g.max),k) : g.mode==='min' ? '≥ '+fmtN(parseNum(g.min),k) : fmtN(parseNum(g.min),k)+'–'+fmtN(parseNum(g.max),k)) : '';
      h += `<div class="nrow ${nd && nd.parent ? 'sub' : ''}"><div>${esc(nName(k, st))}${goalTxt ? ` <span class="muted small">(${esc(goalTxt)})</span>` : ''}</div>
        <div class="num ${s?'st-'+s:''}">${esc(fmtN(E[k]||0, k))}${(P[k]||0) > 0 ? ` <span class="muted small">+${esc(fmtN(P[k], k))}</span>` : ''} ${esc(nUnit(k, st))}</div>
        ${tg ? bar(E[k], A[k], tg, sc, col, true) : ''}</div>`;
    }
    if (!extra.length) h += `<div class="small muted" style="padding-top:6px">${esc(t('no_extra_tracked'))}</div>`;
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}
function bindSummary(v){
  const td = $('[data-act="toggle-details"]', v);
  td && (td.onclick = () => { S.showDetails = !S.showDetails; renderDay(); });
  const sg = $('[data-act="set-goals"]', v);

function itemAmountText(it){
  if (it.basis === 'total') return t('portion');
  return `${fmt(parseNum(it.amount))} ${unitLabel(it.unit)}`;
}
function mealTitle(m){
  if (m.kind === 'simple') return (m.items[0] && m.items[0].name) || m.name || '—';
  return m.name || mealTypeName(m.meal_type);
}
function mealCard(m){
  const T = mealTotals(m), open = S.expanded.has(m.id), ro = readOnly();
  const planned = m.status === 'planned';
  const sub = m.kind === 'simple'
    ? [m.items[0] ? itemAmountText(m.items[0]) : '', m.items[0] && m.items[0].brand].filter(Boolean).join(' · ')
    : t('n_components', {n: m.items.length});
  const hasMacro = ['carbs','protein','fat'].some(k => (T[k]||0) > 0);
  const extrasTxt = visibleNutrients(S.viewSettings).filter(k => !CORE.includes(k) && (T[k]||0) > 0).slice(0, 2).map(k => `${nName(k)} ${fmtN(T[k],k)} ${nUnit(k)}`).join(' · ');
  const macro = hasMacro ? `${t('abbr_carbs')} ${fmt(T.carbs||0,0)} · ${t('abbr_protein')} ${fmt(T.protein||0,0)} · ${t('abbr_fat')} ${fmt(T.fat||0,0)}` : extrasTxt;
  let h = `<div class="meal ${planned?'planned':''}" data-id="${esc(m.id)}">
    <div class="meal-main">
      <button class="check ${planned?'':'on'}" data-act="status" ${ro?'disabled':''} aria-label="${esc(planned ? t('mark_eaten') : t('mark_planned'))}">${planned?'':IC.check}</button>
      <div class="grow" data-act="expand" style="cursor:pointer;min-width:0">
        <div class="meal-title ellipsis">${esc(mealTitle(m))}</div>
        <div class="meal-sub ellipsis">${planned ? `<span class="tag plan">${esc(t('planned'))}</span> ` : ''}${esc([sub, macro].filter(Boolean).join(' · '))}</div>
      </div>
      <div class="meal-kcal num" data-act="expand">${esc(fmt(T.kcal||0,0))}<small>kcal</small></div>
    </div>`;
  if (open){
    h += `<div class="meal-items">`;
    for (const it of m.items){
      const it_t = itemTotals(it);
      h += `<div class="it"><div class="grow ellipsis">${esc(it.name)} <span class="muted">· ${esc(itemAmountText(it))}</span></div><div class="num">${esc(fmt(it_t.kcal||0,0))} kcal</div></div>`;
    }
    const extras = visibleNutrients(S.viewSettings).filter(k => !CORE.includes(k) && isNum(T[k]));
    if (extras.length) h += `<div class="small muted" style="padding-top:4px">${extras.map(k => esc(nName(k))+' '+esc(fmtN(T[k],k))+' '+esc(nUnit(k))).join(' · ')}</div>`;
    if (!ro){
      h += `<div class="meal-actions">
        <button class="btn small" data-act="edit">${esc(t('edit'))}</button>
        <button class="btn small" data-act="copy">${esc(t('copy_to'))}</button>
        ${m.kind === 'composite' ? `<button class="btn small" data-act="tpl">${esc(t('save_template'))}</button>` : ''}
        <button class="btn small danger" data-act="del">${esc(t('delete'))}</button></div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}
function bindMealCard(el){
  const m = S.meals.find(x => x.id === el.dataset.id); if (!m) return;
  $$('[data-act="expand"]', el).forEach(x => x.onclick = () => {
    S.expanded.has(m.id) ? S.expanded.delete(m.id) : S.expanded.add(m.id); renderDay();
  });
  const st = $('[data-act="status"]', el);
  st && (st.onclick = async () => {
    const ns = m.status === 'planned' ? 'eaten' : 'planned';
    m.status = ns; renderDay();
    try { await S.api.updateMeal(m.id, {status: ns}); } catch(err){ toast(errMsg(err), true); refresh(); }
  });
  const ed = $('[data-act="edit"]', el); ed && (ed.onclick = () => openMealEditor(m));
  const cp = $('[data-act="copy"]', el); cp && (cp.onclick = () => openCopy([m]));
  const tp = $('[data-act="tpl"]', el); tp && (tp.onclick = () => saveAsTemplate(m));
  const dl = $('[data-act="del"]', el); dl && (dl.onclick = async () => {
    if (!await askConfirm(t('confirm_delete_meal', {name: mealTitle(m)}), t('delete'), true)) return;
    try { await S.api.deleteMeal(m.id); S.expanded.delete(m.id); toast(t('deleted')); refresh(); } catch(err){ toast(errMsg(err), true); }
  });
}

/* Kalendarz */
function openCalendar(){
  let cur = parseDay(S.day); cur.setDate(1);
  const sh = openSheet({title: t('choose_day'), footer:false});
  let drawVersion = 0;
  const draw = async () => {
    const version = ++drawVersion;
    const y = cur.getFullYear(), mo = cur.getMonth();
    const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
    const from = isoDay(first), to = isoDay(new Date(y, mo, days));
    const offset = (first.getDay() + 6) % 7;
    const monthName = new Intl.DateTimeFormat(LOCALES[S.lang], {month:'long', year:'numeric'}).format(first);
    const dows = [...Array(7)].map((_, i) => new Intl.DateTimeFormat(LOCALES[S.lang], {weekday:'short'}).format(new Date(2024, 0, 1+i)));
    const render = marks => {
      let h = `<div class="cal-h"><button class="iconbtn" data-m="-1">${IC.left}</button><b>${esc(monthName)}</b><button class="iconbtn" data-m="1">${IC.right}</button></div><div class="cal">`;
      h += dows.map(d => `<div class="dow">${esc(d)}</div>`).join('');
      for (let i = 0; i < offset; i++) h += `<button class="out" tabindex="-1"></button>`;
      const today = todayIso();
      for (let d = 1; d <= days; d++){
        const iso = isoDay(new Date(y, mo, d));
        const mk = marks[iso] || {};
        h += `<button data-d="${iso}" class="${iso===S.day?'sel':''} ${iso===today?'today':''}">${d}<span class="dots">${mk.e?'<i></i>':''}${mk.p?'<i class="p"></i>':''}</span></button>`;
      }
      h += `</div><div class="legend" style="margin-top:12px"><span><i class="sw" style="background:var(--ok);width:8px;height:8px;border-radius:50%"></i>${esc(t('eaten'))}</span><span><i class="sw" style="border:1.5px solid var(--near);width:8px;height:8px;border-radius:50%"></i>${esc(t('planned'))}</span></div>
        <button class="btn block" style="margin-top:14px" data-today>${esc(t('today'))}</button>`;
      sh.body.innerHTML = h;
      $$('[data-m]', sh.body).forEach(b => b.onclick = () => { cur.setMonth(cur.getMonth() + Number(b.dataset.m)); draw(); });
      $$('[data-d]', sh.body).forEach(b => b.onclick = async () => { sh.close(); S.day = b.dataset.d; S.expanded.clear(); await refresh(); });
      $('[data-today]', sh.body).onclick = async () => { sh.close(); S.day = todayIso(); await refresh(); };
    };
    render({});
    try {
      const rows = await S.api.monthMarks(S.viewId, from, to);
      const marks = {};
      for (const r of rows){ marks[r.day] = marks[r.day] || {}; marks[r.day][r.status === 'planned' ? 'p' : 'e'] = true; }
      if (sh.el.isConnected && version === drawVersion) render(marks);
    } catch(e){}
  };
  draw();
}

function openDayMenu(){
  const sh = openSheet({title: fmtDate(S.day), footer:false});
  sh.body.innerHTML = `
    <button class="list-item" data-a="copy"><div class="grow"><div class="t">${esc(t('copy_day'))}</div><div class="s">${esc(t('copy_day_hint'))}</div></div></button>
    <button class="list-item" data-a="eaten"><div class="grow"><div class="t">${esc(t('mark_all_eaten'))}</div></div></button>
    <button class="list-item" data-a="clearplan"><div class="grow"><div class="t" style="color:var(--over)">${esc(t('delete_planned'))}</div></div></button>`;
  $('[data-a="copy"]', sh.body).onclick = () => { sh.close(); if (!S.meals.length) return toast(t('day_empty')); openCopy(S.meals); };
  $('[data-a="eaten"]', sh.body).onclick = async () => {
    sh.close();
    try { for (const m of S.meals.filter(m => m.status === 'planned')) await S.api.updateMeal(m.id, {status:'eaten'}); } catch(err){ toast(errMsg(err), true); }
    refresh();
  };
  $('[data-a="clearplan"]', sh.body).onclick = async () => {
    sh.close();
    const pl = S.meals.filter(m => m.status === 'planned');
    if (!pl.length) return toast(t('no_planned'));
    if (!await askConfirm(t('confirm_delete_planned', {n: pl.length}), t('delete'), true)) return;

function openCopy(meals){
  const sh = openSheet({title: meals.length > 1 ? t('copy_day') : t('copy_to')});
  let target = addDays(S.day, 1);
  let status = 'planned';
  const draw = () => {
    sh.body.innerHTML = `<label class="f"><span>${esc(t('target_day'))}</span><input class="inp" type="date" id="cpd" value="${target}"></label>
      <label class="f"><span>${esc(t('status'))}</span><div class="seg" id="cps"><button data-s="planned" class="${status==='planned'?'on':''}">${esc(t('planned'))}</button><button data-s="eaten" class="${status==='eaten'?'on':''}">${esc(t('eaten'))}</button></div></label>
      <p class="hint">${esc(t('copy_n_meals', {n: meals.length}))}</p>`;
    $('#cpd', sh.body).onchange = e => { target = e.target.value; status = target > todayIso() ? 'planned' : status; draw(); };
    $$('#cps button', sh.body).forEach(b => b.onclick = () => { status = b.dataset.s; draw(); });
  };
  draw();
  sh.foot.innerHTML = `<button class="btn" data-c>${esc(t('cancel'))}</button><button class="btn primary" data-ok>${esc(t('copy'))}</button>`;
  $('[data-c]', sh.foot).onclick = () => sh.close();
  $('[data-ok]', sh.foot).onclick = async () => {
    if (!target) return;
    try {
      await S.api.insertMeals(meals.map(m => ({day: target, meal_type: m.meal_type, kind: m.kind, name: m.name, status, items: clone(m.items).map(i => ({...i, id: uid()})), note: m.note || null, position: m.position || 0})));
      sh.close(); toast(t('copied_to', {d: fmtDate(target, {day:'numeric', month:'short'})}));
    } catch(err){ toast(errMsg(err), true); }
  };
}

/* =====================================================================
   Pozycje (produkty w posiłku) – edytor wielokrotnego użytku
   ===================================================================== */
function getRecents(){ try { return JSON.parse(localStorage.getItem('lk_recent_'+(S.me&&S.me.id)) || '[]'); } catch(e){ return []; } }
function pushRecent(id){
  if (!id) return;
  try { const r = getRecents().filter(x => x !== id); r.unshift(id); localStorage.setItem('lk_recent_'+S.me.id, JSON.stringify(r.slice(0, 40))); } catch(e){}
}
function defaultUnit(basis){ return basis === '100ml' ? 'ml' : basis === 'piece' ? 'pc' : basis === 'total' ? 'pc' : 'g'; }
function newItem(){
  return {id:uid(), name:'', brand:'', food_id:null, source:'manual', basis:'100g', piece_g:null, amount:null, unit:'g', n:{}, _save:true, _share:false};
}
function itemFromFood(f){
  return {id:uid(), name:f.name, brand:f.brand||'', barcode:f.barcode||null, food_id:f.id||null, source:f.source||'manual',
    basis:f.basis||'100g', piece_g:f.piece_g ?? null, amount: f.basis === 'piece' ? 1 : 100, unit: defaultUnit(f.basis||'100g'),
    n: clone(f.n||{}), _save: !f.id, _share:false, _upd:false};
}
function stripItem(it){
  const o = {id:it.id||uid(), name:it.name, brand:it.brand||'', food_id:it.food_id||null, source:it.source||'manual',
    basis:it.basis, piece_g: parseNum(it.piece_g), amount: parseNum(it.amount), unit: it.unit, n:{}};
  if (it.barcode) o.barcode = it.barcode;
  for (const k in (it.n||{})){ const v = parseNum(it.n[k]); if (v !== null) o.n[k] = v; }
  return o;
}
function foodFromItem(it){
  return {kind:'food', name:it.name.trim(), brand:(it.brand||'').trim() || null, barcode: it.barcode || null, source: it.source || 'manual',
    basis: it.basis === 'total' ? '100g' : it.basis, piece_g: parseNum(it.piece_g), n: stripItem(it).n};
}
function canEditFood(f){ return f && (f.owner === S.me.id || S.isAdmin); }
function validateItem(it, foodMode){
  if (!String(it.name||'').trim()) return t('v_name');
  const hasVal = Object.values(it.n||{}).some(v => parseNum(v) !== null);
  if (!hasVal) return t('v_values');
  if (!foodMode && it.basis !== 'total'){
    if (!(parseNum(it.amount) > 0)) return t('v_amount');
    if (itemFactor(it) === 0) return t('v_piece');
  }
  return null;
}
async function persistItemToLibrary(it){
  // zapis / aktualizacja w bibliotece, zwraca food_id
  if (it.basis === 'total') return it.food_id || null;
  try {
    if (it.food_id && it._upd){
      const f = S.foods.find(x => x.id === it.food_id);
      if (f && canEditFood(f)){ await S.api.updateFood(f.id, foodFromItem(it)); }
      return it.food_id;
    }
    if (!it.food_id && it._save){
      const f = await S.api.insertFood({...foodFromItem(it), shared: !!it._share});
      return f.id;
    }
  } catch(err){ toast(t('err_lib')+': '+errMsg(err), true); }
  return it.food_id || null;
}

/* ---------------------------------------------------------------------
   mountItemEditor(host, {item, mode:'item'|'food', onMany, onPickFood})
   --------------------------------------------------------------------- */
function mountItemEditor(host, opts){
  const foodMode = opts.mode === 'food';
  const E = {
    item: opts.item ? clone(opts.item) : newItem(),
    tab: opts.tab || (opts.item ? 'form' : (foodMode ? 'form' : (S.foods.some(f => f.kind === 'food') ? 'lib' : 'form'))),
    showAll: false, q: '', libFilter: 'all',
    off: {q:'', code:'', cc: S.lang === 'de' ? 'de' : S.lang === 'en' ? 'world' : 'pl', results:null, loading:false, err:null},
    ai: {text:'', err:null, name:''}
  };
  if (!E.item.unit) E.item.unit = defaultUnit(E.item.basis);
  const tabs = foodMode ? ['form','off','ai'] : ['form','lib','off','ai'];
  host.innerHTML = `<div class="seg" style="margin-top:12px" data-tabs>${tabs.map(x => `<button data-t="${x}">${esc(t('src_'+x))}</button>`).join('')}</div><div data-body></div>`;
  const body = $('[data-body]', host);
  $$('[data-t]', host).forEach(b => b.onclick = () => { stopScan(); E.tab = b.dataset.t; render(); });

  function render(){
    $$('[data-t]', host).forEach(b => b.classList.toggle('on', b.dataset.t === E.tab));
    if (E.tab === 'form') renderForm();
    else if (E.tab === 'lib') renderLib();
    else if (E.tab === 'off') renderOff();
    else renderAi();
  }

  /* ---------- formularz ---------- */
  function unitOptions(){
    const it = E.item, pg = parseNum(it.piece_g);
    if (it.basis === '100g') return pg ? ['g','pc'] : ['g'];
    if (it.basis === '100ml') return pg ? ['ml','pc'] : ['ml'];
    if (it.basis === 'piece') return pg ? ['pc','g'] : ['pc'];
    return [];
  }
  function nutField(k){
    const nd = NUT_BY_KEY[k];
    const v = E.item.n[k];
    return `<label class="f ${nd && nd.parent ? 'sub' : ''}"><span>${esc(nName(k))}</span><div class="unit-inp"><input class="inp num" inputmode="decimal" data-n="${esc(k)}" value="${esc(typeof v === 'string' ? v : inputNum(v))}" placeholder="–"><span class="u">${esc(nUnit(k))}</span></div></label>`;
  }
  function renderForm(){
    const it = E.item;
    const vis = visibleNutrients();
    const rest = allNutrientKeys().filter(k => !vis.includes(k));
    const basisOpts = foodMode ? ['100g','100ml','piece'] : ['100g','100ml','piece','total'];
    const fromLib = it.food_id ? S.foods.find(f => f.id === it.food_id) : null;
    let h = '';
    if (it.source === 'off') h += `<div class="info-box small">${esc(t('off_check'))}</div>`;
    if (it.source === 'ai') h += `<div class="info-box small">${esc(t('ai_check'))}</div>`;
    h += `<label class="f"><span>${esc(t('product_name'))} *</span><input class="inp" data-f="name" value="${esc(it.name)}" autocomplete="off"></label>
      <label class="f"><span>${esc(t('brand_opt'))}</span><input class="inp" data-f="brand" value="${esc(it.brand||'')}" autocomplete="off"></label>
      <div class="grid2">
        <label class="f"><span>${esc(t('values_per'))}</span><select class="inp" data-f="basis">${basisOpts.map(b => `<option value="${b}" ${it.basis===b?'selected':''}>${esc(basisLabel(b))}</option>`).join('')}</select></label>
        ${it.basis !== 'total' ? `<label class="f"><span>${esc(it.basis==='100ml' ? t('piece_ml') : t('piece_g'))}</span><div class="unit-inp"><input class="inp num" inputmode="decimal" data-f="piece_g" value="${esc(inputNum(parseNum(it.piece_g)))}" placeholder="${esc(t('optional'))}"><span class="u">${it.basis==='100ml'?'ml':'g'}</span></div></label>` : '<div></div>'}
      </div>`;
    if (it.basis === 'total') h += `<p class="hint">${esc(t('total_hint'))}</p>`;
    h += `<div class="fieldset-h">${esc(t('nutrition'))} · ${esc(basisLabel(it.basis))}</div><div class="ngrid">${vis.map(nutField).join('')}</div>
      <div class="hint" data-kcalhint></div>
      <button class="linkbtn" data-showall>${esc(E.showAll ? t('fewer_fields') : t('more_fields', {n: rest.length}))}</button>`;
    if (E.showAll && rest.length){
      for (const g of GROUPS){
        const ks = rest.filter(k => (NUT_BY_KEY[k] ? NUT_BY_KEY[k].g : 'custom') === g);
        if (!ks.length) continue;
        h += `<div class="fieldset-h">${esc(t('grp_'+g))}</div><div class="ngrid">${ks.map(nutField).join('')}</div>`;
      }
    }
    if (!foodMode){
      if (it.basis !== 'total'){
        const uo = unitOptions();
        if (!uo.includes(it.unit)) it.unit = uo[0];
        h += `<div class="fieldset-h">${esc(t('eaten_amount'))}</div><div class="grid2">
          <label class="f"><span>${esc(t('amount'))} *</span><input class="inp num" inputmode="decimal" data-f="amount" value="${esc(inputNum(parseNum(it.amount)))}"></label>
          <label class="f"><span>${esc(t('unit'))}</span><select class="inp" data-f="unit">${uo.map(u => `<option value="${u}" ${it.unit===u?'selected':''}>${esc(unitLabel(u))}</option>`).join('')}</select></label></div>`;
      }
      h += `<div class="calc" data-calc></div>`;
      if (it.basis !== 'total'){
        if (!it.food_id){
          h += `<div class="toggle-row" style="margin-top:8px"><span>${esc(t('save_to_lib'))}</span><input type="checkbox" class="sw-t" data-f="_save" ${it._save?'checked':''}></div>`;
          if (it._save) h += `<div class="toggle-row"><span>${esc(t('share_all'))}<br><span class="small muted">${esc(t('share_hint'))}</span></span><input type="checkbox" class="sw-t" data-f="_share" ${it._share?'checked':''}></div>`;
        } else if (fromLib && canEditFood(fromLib)){
          h += `<div class="toggle-row" style="margin-top:8px"><span>${esc(t('update_lib'))}<br><span class="small muted">${esc(t('update_lib_hint'))}</span></span><input type="checkbox" class="sw-t" data-f="_upd" ${it._upd?'checked':''}></div>`;
        } else if (fromLib){
          h += `<p class="hint">${esc(t('from_shared'))}</p>`;
        }
      }
    }
    body.innerHTML = h;
    // zdarzenia
    $$('[data-f]', body).forEach(inp => {
      const f = inp.dataset.f;
      if (inp.type === 'checkbox'){ inp.onchange = () => { it[f] = inp.checked; renderForm(); }; return; }
      if (inp.tagName === 'SELECT'){
        inp.onchange = () => {
          it[f] = inp.value;
          if (f === 'basis'){ it.unit = defaultUnit(it.basis); if (it.basis === 'piece' && !(parseNum(it.amount) > 0 && parseNum(it.amount) < 20)) it.amount = 1; if ((it.basis === '100g' || it.basis === '100ml') && !(parseNum(it.amount) >= 5)) it.amount = 100; }
          if (f === 'unit'){
            const pg = parseNum(it.piece_g), a = parseNum(it.amount);
            if (pg && a !== null){
              if (inp.value === 'pc' && it.basis !== 'piece') it.amount = +(a / pg).toFixed(2);
              else if (inp.value !== 'pc' && it.basis !== 'piece') it.amount = +(a * pg).toFixed(1);
              else if (inp.value === 'g' && it.basis === 'piece') it.amount = +(a * pg).toFixed(1);
              else if (inp.value === 'pc' && it.basis === 'piece') it.amount = +(a / pg).toFixed(2);
            }
          }
          renderForm();
        };
        return;
      }
      inp.oninput = () => { it[f] = (f === 'name' || f === 'brand') ? inp.value : inp.value; updateCalc(); };
      if (f === 'piece_g') inp.onchange = () => renderForm();
    });
    $$('[data-n]', body).forEach(inp => inp.oninput = () => { it.n[inp.dataset.n] = inp.value; updateCalc(); });
    $('[data-showall]', body).onclick = () => { E.showAll = !E.showAll; renderForm(); };
    updateCalc();
  }
  function updateCalc(){
    const it = E.item;
    const bk = baseKcal(Object.fromEntries(Object.entries(it.n).map(([k,v]) => [k, parseNum(v)])));
    const kh = $('[data-kcalhint]', body);
    if (kh) kh.textContent = bk.calc && bk.v !== null ? t('kcal_calc', {v: fmt(bk.v, 0)}) : '';
    const c = $('[data-calc]', body); if (!c) return;
    const probe = {...it, n: Object.fromEntries(Object.entries(it.n).map(([k,v]) => [k, parseNum(v)]))};
    const T = itemTotals(probe);
    const f = itemFactor(probe);
    if (!f && it.basis !== 'total'){ c.innerHTML = `<span class="muted">${esc(t('enter_amount'))}</span>`; return; }
    const extra = visibleNutrients().filter(k => !CORE.includes(k) && isNum(T[k])).map(k => `${esc(nName(k))} ${esc(fmtN(T[k],k))} ${esc(nUnit(k))}`);
    c.innerHTML = `<b class="num">${esc(fmt(T.kcal||0,0))} kcal</b> · ${esc(t('n_carbs'))} ${esc(fmt(T.carbs||0))} g · ${esc(t('n_protein'))} ${esc(fmt(T.protein||0))} g · ${esc(t('n_fat'))} ${esc(fmt(T.fat||0))} g${extra.length ? '<div class="small muted" style="margin-top:4px">'+extra.join(' · ')+'</div>' : ''}`;
  }

  /* ---------- biblioteka ---------- */
  function renderLib(){
    body.innerHTML = `<div class="row" style="margin-top:12px"><input class="inp grow" data-q placeholder="${esc(t('search_lib'))}" value="${esc(E.q)}" autocomplete="off"></div>
      <div class="chips" style="margin-top:8px">${['all','mine','shared'].map(x => `<button class="chip ${E.libFilter===x?'on':''}" data-lf="${x}">${esc(t('lf_'+x))}</button>`).join('')}</div>
      <div data-list style="margin-top:6px"></div>`;
    const q = $('[data-q]', body);
    q.oninput = () => { E.q = q.value; drawList(); };
    $$('[data-lf]', body).forEach(b => b.onclick = () => { E.libFilter = b.dataset.lf; renderLib(); });
    drawList();
    if (!('ontouchstart' in window)) q.focus();
  }
  function drawList(){
    const L = $('[data-list]', body); if (!L) return;
    const nq = normalizeText(E.q);
    let foods = S.foods.filter(f => f.kind === 'food');
    if (E.libFilter === 'mine') foods = foods.filter(f => f.owner === S.me.id);
    if (E.libFilter === 'shared') foods = foods.filter(f => f.shared);
    if (nq) foods = foods.filter(f => normalizeText(f.name + ' ' + (f.brand||'')).includes(nq));
    const rec = getRecents();
    foods.sort((a,b) => {
      const ra = rec.indexOf(a.id), rb = rec.indexOf(b.id);
      if (!nq && (ra !== -1 || rb !== -1)) return (ra === -1 ? 999 : ra) - (rb === -1 ? 999 : rb);
      return a.name.localeCompare(b.name, LOCALES[S.lang]);
    });
    if (!foods.length){
      L.innerHTML = `<div class="empty">${esc(nq ? t('lib_no_match') : t('lib_empty'))}</div>
        <button class="btn block" data-new>${esc(t('enter_manually'))}</button>`;
      $('[data-new]', L).onclick = () => { E.item = newItem(); E.item.name = E.q; E.tab = 'form'; render(); };
      return;
    }
    L.innerHTML = foods.slice(0, 150).map(f => foodRow(f)).join('');
    $$('[data-fid]', L).forEach(b => b.onclick = () => {
      const f = S.foods.find(x => x.id === b.dataset.fid);
      E.item = itemFromFood(f); E.tab = 'form'; render();
      setTimeout(() => { const a = $('[data-f="amount"]', body); a && a.focus(); a && a.select && a.select(); }, 30);
    });
  }

  /* ---------- Open Food Facts ---------- */
  let stream = null, scanTimer = null;
  function stopScan(){
    if (scanTimer){ clearInterval(scanTimer); scanTimer = null; }
    if (stream){ stream.getTracks().forEach(tr => tr.stop()); stream = null; }
  }
  E.stop = stopScan;
  function renderOff(){
    const o = E.off;
    const canScan = 'BarcodeDetector' in window && navigator.mediaDevices;
    let h = `<div class="chips" style="margin-top:12px">${['pl','de','world'].map(c => `<button class="chip ${o.cc===c?'on':''}" data-cc="${c}">${esc(t('cc_'+c))}</button>`).join('')}</div>
      <form data-offs class="row" style="margin-top:10px"><input class="inp grow" name="q" placeholder="${esc(t('off_search_ph'))}" value="${esc(o.q)}" autocomplete="off"><button class="btn primary" type="submit">${esc(t('search'))}</button></form>
      <form data-offc class="row" style="margin-top:8px"><input class="inp grow num" name="code" inputmode="numeric" placeholder="${esc(t('barcode'))}" value="${esc(o.code)}"><button class="btn" type="submit">${esc(t('find'))}</button>
        ${canScan ? `<button class="btn" type="button" data-scan aria-label="${esc(t('scan'))}">${IC.scan}</button>` : ''}</form>
      <div data-scanbox></div>
      ${canScan ? '' : `<p class="hint">${esc(t('scan_unsupported'))}</p>`}
      <div data-offres style="margin-top:6px"></div>
      <p class="hint">${esc(t('off_note'))}</p>`;
    body.innerHTML = h;
    $$('[data-cc]', body).forEach(b => b.onclick = () => { o.cc = b.dataset.cc; renderOff(); });
    $('[data-offs]', body).onsubmit = async e => {
      e.preventDefault(); o.q = e.target.q.value.trim(); if (!o.q) return;
      o.loading = true; o.err = null; drawOff();
      try { o.results = await OFF.search(o.q, S.lang, o.cc); }
      catch(err){ o.err = err.message === 'rate' ? t('off_rate') : t('off_err')+' ('+errMsg(err)+')'; o.results = null; }
      o.loading = false; drawOff();
    };
    $('[data-offc]', body).onsubmit = async e => { e.preventDefault(); o.code = e.target.code.value.trim(); if (o.code) lookupCode(o.code); };
    const sc = $('[data-scan]', body); sc && (sc.onclick = startScan);
    drawOff();
  }
  async function lookupCode(code){
    const o = E.off;
    const local = S.foods.find(f => f.barcode && f.barcode === code && f.kind === 'food');
    if (local){ toast(t('found_in_lib')); E.item = itemFromFood(local); E.tab = 'form'; render(); return; }
    o.loading = true; o.err = null; drawOff();
    try {
      const f = await OFF.byCode(code, S.lang);
      o.loading = false;
      if (!f){ o.err = t('off_notfound'); drawOff(); return; }
      pickOff(f);
    } catch(err){ o.loading = false; o.err = t('off_err')+' ('+errMsg(err)+')'; drawOff(); }
  }
  function pickOff(f){
    const it = itemFromFood({...f, id:null});
    it.source = 'off'; it._save = true;
    E.item = it; E.tab = 'form'; render();
  }
  function drawOff(){
    const R = $('[data-offres]', body); if (!R) return;
    const o = E.off;
    if (o.loading){ R.innerHTML = '<div class="spinner"></div>'; return; }
    if (o.err){ R.innerHTML = `<div class="err-box">${esc(o.err)}</div>`; return; }
    if (!o.results){ R.innerHTML = ''; return; }
    if (!o.results.length){ R.innerHTML = `<div class="empty">${esc(t('off_none'))}</div>`; return; }
    R.innerHTML = o.results.map((f, i) => `<button class="list-item" data-oi="${i}"><div class="grow"><div class="t ellipsis">${esc(f.name || '—')}</div><div class="s ellipsis">${esc([f.brand, f.quantity].filter(Boolean).join(' · '))}</div></div><div class="num small">${isNum(f.n.kcal) ? esc(fmt(f.n.kcal,0))+' kcal' : '–'}<div class="muted">${esc(basisLabel(f.basis))}</div></div></button>`).join('');
    $$('[data-oi]', R).forEach(b => b.onclick = () => pickOff(o.results[Number(b.dataset.oi)]));
  }
  async function startScan(){
    const box = $('[data-scanbox]', body);
    try {
      stopScan();
      const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      box.innerHTML = `<video class="scan" playsinline muted></video><button class="btn block small" style="margin-top:6px" data-stop>${esc(t('cancel'))}</button>`;
      const v = $('video', box); v.srcObject = stream; await v.play();
      $('[data-stop]', box).onclick = () => { stopScan(); box.innerHTML = ''; };
      scanTimer = setInterval(async () => {
        try {
          const codes = await det.detect(v);
          if (codes.length){ const c = codes[0].rawValue; stopScan(); box.innerHTML = ''; E.off.code = c; renderOff(); lookupCode(c); }
        } catch(e){}
      }, 350);
    } catch(err){ stopScan(); box.innerHTML = `<div class="err-box">${esc(t('scan_err'))}</div>`; }
  }

  /* ---------- AI ---------- */
  function renderAi(){
    const a = E.ai;
    if (!a.name) a.name = [E.item.name, E.item.brand].filter(Boolean).join(' ');
    body.innerHTML = `<p class="hint">${esc(t('ai_intro'))}</p>
      <label class="f"><span>${esc(t('ai_product'))}</span><input class="inp" data-ain value="${esc(a.name)}" placeholder="${esc(t('ai_product_ph'))}"></label>
      <div class="row wrap" style="margin-top:10px">
        <button class="btn grow" data-copy="text">${esc(t('ai_copy_text'))}</button>
        <button class="btn grow" data-copy="photo">${esc(t('ai_copy_photo'))}</button>
      </div>
      <div data-promptbox></div>
      <label class="f"><span>${esc(t('ai_paste'))}</span><textarea class="inp" data-ait placeholder='{"name": "...", "n": {"kcal": 123, ...}}'>${esc(a.text)}</textarea></label>
      <div data-aierr></div>
      <button class="btn primary block" style="margin-top:10px" data-parse>${esc(t('ai_load'))}</button>`;
    $('[data-ain]', body).oninput = e => a.name = e.target.value;
    $('[data-ait]', body).oninput = e => a.text = e.target.value;
    $$('[data-copy]', body).forEach(b => b.onclick = async () => {
      const p = buildAiPrompt(b.dataset.copy, a.name, !!opts.onMany);
      const pb = $('[data-promptbox]', body);
      pb.innerHTML = `<label class="f"><span>${esc(t('ai_prompt_label'))}</span><textarea class="inp" readonly style="min-height:140px">${esc(p)}</textarea></label>`;
      try { await navigator.clipboard.writeText(p); toast(t('copied')); }
      catch(e){ const ta = $('textarea', pb); ta.focus(); ta.select(); toast(t('copy_manual')); }
    });
    $('[data-parse]', body).onclick = () => {
      const errBox = $('[data-aierr]', body);
      try {
        const j = extractJson(a.text);
        const arr = Array.isArray(j) ? j : [j];
        const items = arr.map(o => normalizeAiFood(o, S.settings.custom)).filter(Boolean).map(f => {
          const it = itemFromFood({...f, id:null, source:'ai'});
          if (isNum(f.amount)) it.amount = f.amount;
          it.source = 'ai'; it._save = true;
          return it;
        });
        if (!items.length) throw new Error('empty');
        if (items.length > 1 && opts.onMany){ opts.onMany(items); return; }
        E.item = items[0]; E.tab = 'form'; render();
      } catch(e){ errBox.innerHTML = `<div class="err-box">${esc(t('ai_parse_err'))}</div>`; }
    };
  }

  render();
  return {
    get(){ return E.item; },
    validate(){ return validateItem(E.item, foodMode); },
    show(tab){ E.tab = tab; render(); },
    destroy(){ stopScan(); }
  };
}

function foodRow(f, showOwner){
  const tags = [];
  if (f.shared) tags.push(`<span class="tag shared">${esc(t('shared'))}</span>`);
  if (f.source === 'ai') tags.push(`<span class="tag approx">AI</span>`);
  if (f.source === 'off') tags.push(`<span class="tag">OFF</span>`);
  const kc = baseKcal(f.n || {});
  const right = f.kind === 'template'
    ? `${esc(t('n_components', {n: (f.items||[]).length}))}`
    : `${isNum(kc.v) ? esc(fmt(kc.v,0))+' kcal' : '–'}<div class="muted">${esc(basisLabel(f.basis))}</div>`;
  const ownerName = showOwner && f.owner !== S.me.id ? (S.profiles.find(p => p.id === f.owner) || {}).display_name : null;
  return `<button class="list-item" data-fid="${esc(f.id)}"><div class="grow" style="min-width:0"><div class="t ellipsis">${esc(f.name)}</div>
    <div class="s row" style="gap:6px;flex-wrap:wrap">${f.brand ? '<span>'+esc(f.brand)+'</span>' : ''}${tags.join('')}${ownerName ? '<span>· '+esc(ownerName)+'</span>' : ''}</div></div>
    <div class="num small" style="text-align:right">${right}</div></button>`;
}

function buildAiPrompt(kind, product, many){
  const keys = allNutrientKeys();
  const nObj = keys.map(k => `    "${k}": null`).join(',\n');
  const units = keys.map(k => `${k} = ${nName(k)} [${nUnit(k)}]`).join('; ');
  const schema = `{\n  "name": "",\n  "brand": "",\n  "basis": "100g",\n  "piece_g": null,\n  "amount": null,\n  "n": {\n${nObj}\n  }\n}`;
  const tpl = kind === 'photo' ? t('ai_prompt_photo') : t('ai_prompt_text');
  return tpl.split('{product}').join(product || '?').split('{schema}').join(schema).split('{units}').join(units)
    + (many ? '\n\n' + t('ai_prompt_many') : '');
}

function openMealEditor(meal, presetType, prefill){
  const editing = !!meal;
  const st = S.settings;
  const M = meal ? clone(meal) : {
    day: S.day, meal_type: presetType || guessMealType(), kind: 'simple', name: '',
    status: S.day > todayIso() ? 'planned' : 'eaten', items: [], note: null, position: 0
  };
  if (!meal && prefill) Object.assign(M, prefill);
  let ed = null;
  const sh = openSheet({title: editing ? t('edit_meal') : t('add_meal'), onClose: () => ed && ed.destroy()});
  sh.body.innerHTML = `<div class="chips" style="margin-top:12px" data-types></div>
    <div class="grid2" style="margin-top:10px">
      <div class="seg" data-kind><button data-k="simple">${esc(t('kind_simple'))}</button><button data-k="composite">${esc(t('kind_composite'))}</button></div>
      <div class="seg" data-status><button data-s="eaten">${esc(t('eaten'))}</button><button data-s="planned">${esc(t('planned'))}</button></div>
    </div>
    <p class="hint" data-kindhint></p>
    <div data-main></div>`;
  const types = [...st.mealTypes.map(m => m.id)];
  if (!types.includes(M.meal_type)) types.push(M.meal_type);
  const drawHead = () => {
    $('[data-types]', sh.body).innerHTML = types.map(id => `<button class="chip ${M.meal_type===id?'on':''}" data-ty="${esc(id)}">${esc(mealTypeName(id))}</button>`).join('');
    $$('[data-ty]', sh.body).forEach(b => b.onclick = () => { M.meal_type = b.dataset.ty; drawHead(); });
    $$('[data-k]', sh.body).forEach(b => b.classList.toggle('on', b.dataset.k === M.kind));
    $$('[data-s]', sh.body).forEach(b => b.classList.toggle('on', b.dataset.s === M.status));
    $('[data-kindhint]', sh.body).textContent = M.kind === 'simple' ? t('kind_simple_hint') : t('kind_composite_hint');
  };
  $$('[data-s]', sh.body).forEach(b => b.onclick = () => { M.status = b.dataset.s; drawHead(); });
  $$('[data-k]', sh.body).forEach(b => b.onclick = async () => {
    const k = b.dataset.k; if (k === M.kind) return;
    if (k === 'composite'){
      if (ed){ const it = ed.get(); if (!validateItem(it)) M.items = [it]; else M.items = []; ed.destroy(); ed = null; }
    } else {
      if (M.items.length > 1 && !await askConfirm(t('to_simple_confirm'))) return;
      M.items = M.items.slice(0, 1);
    }
    M.kind = k; drawHead(); drawMain();
  });
  const main = $('[data-main]', sh.body);
  function drawMain(){
    if (M.kind === 'simple'){
      main.innerHTML = '<div data-ie></div>';
      ed = mountItemEditor($('[data-ie]', main), {item: M.items[0] || null, mode:'item', onMany: items => {
        M.kind = 'composite'; M.items = items; ed && ed.destroy(); ed = null; drawHead(); drawMain(); toast(t('ai_many_added', {n: items.length}));
      }});
      return;
    }
    const T = mealTotals(M);
    const templates = S.foods.filter(f => f.kind === 'template');
    main.innerHTML = `<label class="f"><span>${esc(t('meal_name'))}</span><input class="inp" data-mn value="${esc(M.name||'')}" placeholder="${esc(mealTypeName(M.meal_type))}"></label>
      <div class="fieldset-h">${esc(t('components'))}</div>
      <div data-items>${M.items.length ? '' : `<div class="empty">${esc(t('no_components'))}</div>`}</div>
      <div class="row wrap" style="margin-top:10px">
        <button class="btn grow" data-addc>${IC.plus} ${esc(t('add_component'))}</button>
        ${templates.length ? `<button class="btn grow" data-tpl>${esc(t('from_template'))}</button>` : ''}
      </div>
      <div class="calc"><b class="num">${esc(fmt(T.kcal||0,0))} kcal</b> · ${esc(t('n_carbs'))} ${esc(fmt(T.carbs||0))} g · ${esc(t('n_protein'))} ${esc(fmt(T.protein||0))} g · ${esc(t('n_fat'))} ${esc(fmt(T.fat||0))} g</div>`;
    $('[data-mn]', main).oninput = e => M.name = e.target.value;
    const L = $('[data-items]', main);
    if (M.items.length) L.innerHTML = M.items.map((it, i) => `<div class="list-item"><div class="grow" style="min-width:0;cursor:pointer" data-ei="${i}"><div class="t ellipsis">${esc(it.name)}</div><div class="s">${esc(itemAmountText(it))} · ${esc(fmt(itemTotals(it).kcal||0,0))} kcal</div></div>
      <button class="iconbtn plain" data-ri="${i}" aria-label="${esc(t('delete'))}">${IC.close}</button></div>`).join('');
    $$('[data-ei]', L).forEach(x => x.onclick = () => openComponentEditor(M.items[Number(x.dataset.ei)], it => { M.items[Number(x.dataset.ei)] = it; drawMain(); }));
    $$('[data-ri]', L).forEach(x => x.onclick = () => { M.items.splice(Number(x.dataset.ri), 1); drawMain(); });
    $('[data-addc]', main).onclick = () => openComponentEditor(null, it => { M.items.push(it); drawMain(); }, items => { M.items.push(...items); drawMain(); });
    const tb = $('[data-tpl]', main);
    tb && (tb.onclick = () => pickTemplate(tpl => {
      M.items.push(...clone(tpl.items).map(i => ({...i, id: uid()})));
      if (!M.name) M.name = tpl.name;
      drawMain();
    }));
  }
  drawHead(); drawMain();
  sh.foot.innerHTML = `<button class="btn" data-c>${esc(t('cancel'))}</button><button class="btn primary" data-ok>${esc(editing ? t('save') : t('add'))}</button>`;
  $('[data-c]', sh.foot).onclick = () => sh.close();
  $('[data-ok]', sh.foot).onclick = async () => {
    const btn = $('[data-ok]', sh.foot);
    if (M.kind === 'simple'){
      const it = ed.get();
      const err = validateItem(it);
      if (err){ toast(err, true); ed.show('form'); return; }
      M.items = [it];
      M.name = null;
    } else {
      if (!M.items.length){ toast(t('v_components'), true); return; }
    }
    btn.disabled = true;
    try {
      const items = [];
      for (const it of M.items){
        const fid = await persistItemToLibrary(it);
        pushRecent(fid);
        items.push({...stripItem(it), food_id: fid});
      }
      const row = {day: M.day, meal_type: M.meal_type, kind: M.kind, name: M.kind === 'composite' ? (M.name || null) : null, status: M.status, items, note: M.note || null};
      if (editing) await S.api.updateMeal(meal.id, row);
      else { row.position = S.meals.filter(m => m.meal_type === M.meal_type).length; await S.api.insertMeal(row); }
      await loadFoods();
      sh.close(); toast(editing ? t('saved') : t('added'));
      if (M.day !== S.day){ S.day = M.day; }
      refresh();
    } catch(err){ btn.disabled = false; toast(errMsg(err), true); }
  };
}
function guessMealType(){
  const h = new Date().getHours();
  const ids = S.settings.mealTypes.map(m => m.id);
  const want = h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 21 ? 'dinner' : 'other';
  return ids.includes(want) ? want : ids[0];
}
function openComponentEditor(item, onDone, onMany){
  let ed;
  const sh = openSheet({title: item ? t('edit_component') : t('add_component'), onClose: () => ed && ed.destroy()});
  ed = mountItemEditor(sh.body, {item, mode:'item', onMany: onMany ? items => { sh.close(); onMany(items); toast(t('ai_many_added', {n: items.length})); } : null});
  sh.foot.innerHTML = `<button class="btn" data-c>${esc(t('cancel'))}</button><button class="btn primary" data-ok>${esc(t('ok'))}</button>`;
  $('[data-c]', sh.foot).onclick = () => sh.close();
  $('[data-ok]', sh.foot).onclick = () => {
    const it = ed.get(); const err = validateItem(it);
    if (err){ toast(err, true); ed.show('form'); return; }
    sh.close(); onDone(it);
  };
}
function pickTemplate(cb){
  const sh = openSheet({title: t('from_template'), footer:false});
  const tpls = S.foods.filter(f => f.kind === 'template').sort((a,b) => a.name.localeCompare(b.name, LOCALES[S.lang]));
  sh.body.innerHTML = tpls.map(f => foodRow(f)).join('') || `<div class="empty">${esc(t('no_templates'))}</div>`;
  $$('[data-fid]', sh.body).forEach(b => b.onclick = () => { const f = tpls.find(x => x.id === b.dataset.fid); sh.close(); cb(f); });
}

function openFoodEditor(food){
  const editable = !food || canEditFood(food);

  const sh = openSheet({title: food ? (editable ? t('edit_product') : food.name) : t('new_product'), onClose: () => ed && ed.destroy()});
  if (!editable){
    const n = food.n || {};
    sh.body.innerHTML = `<p class="muted">${esc(food.brand || '')} · ${esc(basisLabel(food.basis))}${food.piece_g ? ' · 1 '+esc(t('unit_pc'))+' = '+esc(fmt(food.piece_g))+' g' : ''}</p>` +
      Object.keys(n).map(k => `<div class="nrow"><div>${esc(nName(k))}</div><div class="num">${esc(fmtN(n[k],k))} ${esc(nUnit(k))}</div></div>`).join('') +

  }

  sh.body.appendChild(holder); sh.body.appendChild(extra);
  const item = food ? {...itemFromFood(food), n: clone(food.n||{})} : null;

  }

  $('[data-del]', sh.foot) && ($('[data-del]', sh.foot).onclick = async () => {

    try { await S.api.deleteFood(food.id); await loadFoods(); sh.close(); toast(t('deleted')); renderView(); } catch(err){ toast(errMsg(err), true); }

    const it = ed.get(); const err = validateItem(it, true);
    if (err){ toast(err, true); ed.show('form'); return; }

    if (isOwner) row.shared = shared.v;
    try {
      if (food) await S.api.updateFood(food.id, row); else await S.api.insertFood(row);
      await loadFoods(); sh.close(); toast(t('saved')); renderView();
