const UL_SOURCE='https://www.efsa.europa.eu/sites/default/files/2024-05/ul-summary-report.pdf';
const ADULT_UL={vitD:100,vitB6:12,se:255,zn:25};
function upperLimitStatus(meals,key){
  const items=meals.filter(m=>m.status==='eaten').flatMap(m=>m.items||[]);
  const known=items.filter(it=>parseNum((it.n||{})[key])!==null && itemFactor(it)>0);
  const sum=known.reduce((total,it)=>total+(itemTotals(it)[key]||0),0);
  const complete=items.length>0 && known.length===items.length;
  return {sum,status:sum>ADULT_UL[key]?'over':complete?'below':'unknown'};
}
function upperLimitCard(meals){
  return `<section class="card"><div class="fieldset-h">${esc(t('ul_title'))}</div><p class="hint">${esc(t('ul_note'))}</p>${Object.keys(ADULT_UL).map(k=>{
    const r=upperLimitStatus(meals,k),color=r.status==='over'?'var(--over)':r.status==='below'?'var(--ok)':'var(--muted)';
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(nName(k))}</b> · ${esc(fmt(r.sum,2))} / ${ADULT_UL[k]} ${esc(nUnit(k))}<div class="small" style="color:${color}">${esc(t('ul_'+r.status))}</div></div>`;
  }).join('')}<p><a href="${UL_SOURCE}" target="_blank" rel="noopener noreferrer">${esc(t('ul_source'))}</a></p></section>`;
}

/* Weight is stored in the existing protected profile settings and JSON export. */
function weightCard(st, readonly){
  const w = weightStats(st.weight), week = weightWeek(st.weight);
  const signed = n => (n > 0 ? '+' : '') + fmt(n,2);
  return `<section class="card" aria-label="${esc(t('weight'))}">
    <div class="fieldset-h" style="margin-top:0">${esc(t('weight'))}</div>
    <div class="grid2"><div><span class="small muted">${esc(t('weight_latest'))}</span>
      <div style="font-size:26px;font-weight:700">${w.latest ? esc(fmt(w.latest.kg,2))+' kg' : '—'}</div>
      ${w.latest ? `<span class="small muted">${esc(fmtDate(w.latest.day))}</span>` : `<span class="small muted">${esc(t('weight_empty'))}</span>`}</div>
      <div><span class="small muted">${esc(t('weight_goal'))}</span><div style="font-size:26px;font-weight:700">${w.goal !== null ? esc(fmt(w.goal,2))+' kg' : '—'}</div></div></div>
    ${w.entries.length > 1 ? `<p class="small">${esc(t('weight_change'))}: <b>${esc(signed(w.change))} kg</b></p>` : ''}
    ${w.remaining !== null ? `<p class="small">${esc(t('weight_remaining'))}: <b>${esc(fmt(w.remaining,2))} kg</b></p>` : ''}
    ${week.average !== null ? `<p class="small">${esc(t('weight_average'))}: <b>${esc(fmt(week.average,2))} kg</b> <span class="muted">(${esc(t('weight_samples'))}: ${week.count})</span></p>` : ''}
    ${week.change !== null ? `<p class="small">${esc(t('weight_week_change'))}: <b>${esc(signed(week.change))} kg</b></p>` : ''}
    <div class="row wrap" style="margin-top:14px">${!readonly ? `<button class="btn small primary" data-weight-add>${esc(t('weight_add'))}</button>` : ''}<button class="btn small" data-weight-history>${esc(t('weight_history'))}</button></div>
  </section>`;
}
function bindWeightCard(root, st, readonly){
  const add = $('[data-weight-add]', root);
  if (add) add.onclick = () => openWeightEntry();
  const history = $('[data-weight-history]', root);
  if (history) history.onclick = () => openWeightHistory(st, readonly);
}
async function persistWeight(next){
  clearTimeout(saveTimer);
  const settings = {...S.settings, weight:normalizeWeight(next)};
  const id = S.me.id;
  settingsWrite = settingsWrite.catch(() => {}).then(() => S.api.updateProfile(id, {settings:clone(settings)}));
  const profile = await settingsWrite;
  S.profile = profile;
  S.settings.weight = settings.weight;
  if (S.viewId === S.me.id) S.viewSettings = S.settings;
  const own = S.profiles.find(p => p.id === S.me.id);
  if (own) own.settings = settings;
  renderView();
}
function openWeightEntry(entry, onSaved){
  const day = entry ? entry.day : (validWeightDay(S.day) ? S.day : todayIso());
  const existing = normalizeWeight(S.settings.weight).entries.find(e => e.day === day);
  const sh = openSheet({title:t('weight_add'), footer:false});
  sh.body.innerHTML = `<form data-weight-form>
    <label class="f"><span>${esc(t('weight_date'))}</span><input class="inp" type="date" name="day" required max="${todayIso()}" value="${day}" ${entry ? 'readonly' : ''}></label>
    <label class="f"><span>${esc(t('weight_kg'))}</span><input class="inp" inputmode="decimal" name="kg" required autocomplete="off" value="${existing ? esc(inputNum(existing.kg)) : ''}" placeholder="72,5"></label>
    <p class="hint">${esc(t('weight_replace'))}</p><p class="hint">${esc(t('weight_privacy'))}</p>
    <div role="alert" data-weight-error></div><button type="submit" class="btn primary block">${esc(t('save'))}</button></form>`;
  const form = $('[data-weight-form]', sh.body);
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = $('button[type=submit]', form); if (btn.disabled) return;
    btn.disabled = true;
    try {
      const next = upsertWeight(S.settings.weight, form.elements.day.value, form.elements.kg.value);
      await persistWeight(next); sh.close(); if (onSaved) onSaved(); toast(t('saved'));
    } catch(err){ $('[data-weight-error]', form).textContent = errMsg(err); btn.disabled = false; }
  };
}
function weightChart(entries){
  if (entries.length < 2) return '';
  const points = entries.slice(-60), min = Math.min(...points.map(p=>p.kg)), max = Math.max(...points.map(p=>p.kg));
  const t0 = Date.parse(points[0].day), span = Date.parse(points[points.length-1].day)-t0 || 1;
  const range = max-min || 1;
  const path = points.map(p => `${16+(Date.parse(p.day)-t0)/span*288},${92-(p.kg-min)/range*64}`).join(' ');
  return `<svg viewBox="0 0 320 120" role="img" aria-label="${esc(t('weight_history'))}" style="width:100%;height:auto;color:var(--accent)"><polyline points="${path}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><text x="16" y="16" fill="var(--muted)" font-size="11">${esc(fmt(max,2))} kg</text><text x="16" y="115" fill="var(--muted)" font-size="11">${esc(points[0].day)}</text><text x="304" y="115" text-anchor="end" fill="var(--muted)" font-size="11">${esc(points[points.length-1].day)}</text></svg>`;
}
function openWeightHistory(st, readonly){
  const sh = openSheet({title:t('weight_history'), footer:false});
  const draw = () => {
    const w = normalizeWeight((readonly ? st : S.settings).weight);
    sh.body.innerHTML = `${!readonly ? `<form data-weight-goal><label class="f"><span>${esc(t('weight_goal'))} (kg)</span><input class="inp" name="goal" inputmode="decimal" value="${esc(inputNum(w.goal))}" placeholder="${esc(t('weight_goal_placeholder'))}"></label><p class="hint">${esc(t('weight_goal_hint'))}</p><button class="btn small" type="submit">${esc(t('weight_save_goal'))}</button><div data-goal-error role="alert"></div></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">` : ''}
      ${weightChart(w.entries)}<p class="hint">${esc(t('weight_week_hint'))}</p>${!readonly && w.entries.length ? `<button class="btn small" data-weight-csv style="margin-bottom:12px">${esc(t('weight_csv'))}</button>` : ''}<div style="max-height:340px;overflow:auto">${w.entries.length ? [...w.entries].reverse().map(e => `<div class="list-item"><div class="grow"><b>${esc(fmt(e.kg,2))} kg</b><div class="small muted">${esc(fmtDate(e.day))}</div></div>${readonly ? '' : `<button class="btn small" data-weight-edit="${e.day}">${esc(t('weight_edit'))}</button><button class="btn small danger" data-weight-delete="${e.day}" aria-label="${esc(t('delete'))} ${e.day}">${esc(t('delete'))}</button>`}</div>`).join('') : `<p class="muted">${esc(t('weight_empty'))}</p>`}</div>
      <p class="hint">${esc(t('weight_privacy'))}</p>`;
    if (readonly) return;
    const exportButton = $('[data-weight-csv]',sh.body);
    if (exportButton) exportButton.onclick = () => download(`weight_${todayIso()}.csv`,weightCsv(S.settings.weight,S.lang),'text/csv;charset=utf-8');
    $('[data-weight-goal]',sh.body).onsubmit = async e => {
      e.preventDefault(); const f=e.target, btn=$('button',f); if (btn.disabled) return;
      const raw=f.elements.goal.value.trim(), goal=validWeight(raw);
      if (raw && goal === null){ $('[data-goal-error]',f).textContent=t('weight_invalid'); return; }
      btn.disabled=true;
      try { await persistWeight({...normalizeWeight(S.settings.weight),goal}); draw(); toast(t('saved')); }
      catch(err){ $('[data-goal-error]',f).textContent=errMsg(err); btn.disabled=false; }
    };
    $$('[data-weight-edit]',sh.body).forEach(b => b.onclick=()=>openWeightEntry(w.entries.find(e=>e.day===b.dataset.weightEdit),draw));
    $$('[data-weight-delete]',sh.body).forEach(b => b.onclick=async()=>{
      if (!await askConfirm(t('weight_delete'),t('delete'),true)) return;
      b.disabled=true;
      try { const now=normalizeWeight(S.settings.weight); await persistWeight({...now,entries:now.entries.filter(e=>e.day!==b.dataset.weightDelete)}); draw(); toast(t('deleted')); }
      catch(err){ toast(errMsg(err),true); b.disabled=false; }
    });
  };
  draw();
}

/* =====================================================================
   Ustawienia
   ===================================================================== */
function renderSettings(){
  const v = $('#view');
  const st = S.settings;
  const vis = visibleNutrients(st);
  let h = '';
  // Konto
  h += `<div class="card"><div class="fieldset-h" style="margin-top:0">${esc(t('account'))}</div>
    <label class="f"><span>${esc(t('display_name'))}</span><input class="inp" data-dn value="${esc(S.profile.display_name || '')}"></label>
    <p class="small muted">${esc(S.me.email || '')}${S.isAdmin ? ' · <b>'+esc(t('admin'))+'</b>' : ''}</p>
    <div class="row wrap"><button class="btn small" data-pw>${esc(t('change_pw'))}</button><button class="btn small" data-out>${esc(t('sign_out'))}</button></div></div>`;
  h += weightCard(st, false);
  h += `<div class="card"><div class="fieldset-h">${esc(t('ul_title'))}</div><label class="toggle-row"><span>${esc(t('ul_enable'))}</span><input type="checkbox" data-ul ${st.upperWarnings?'checked':''}></label><p class="hint">${esc(t('ul_note'))}</p><a href="${UL_SOURCE}" target="_blank" rel="noopener noreferrer">${esc(t('ul_source'))}</a></div>`;
  // Język i wygląd
  h += `<div class="card"><div class="fieldset-h" style="margin-top:0">${esc(t('language'))}</div>
    <div class="seg">${['pl','de','en'].map(l => `<button data-lang="${l}" class="${S.lang===l?'on':''}">${esc(t('lang_'+l))}</button>`).join('')}</div>
    <div class="fieldset-h">${esc(t('theme'))}</div>
    <div class="seg">${['auto','light','dark'].map(x => `<button data-theme="${x}" class="${st.theme===x?'on':''}">${esc(t('theme_'+x))}</button>`).join('')}</div></div>`;
  // Cele
  h += `<div class="card" id="goals"><div class="fieldset-h" style="margin-top:0">${esc(t('goals'))}</div><p class="hint" style="margin-top:0">${esc(t('goals_hint'))}</p>`;
  for (const k of vis){
    const g = st.goals[k] || {mode:''};
    h += `<div style="padding:10px 0;border-bottom:1px solid var(--line)" data-goal="${esc(k)}">
      <div class="row"><div class="grow"><b>${esc(nName(k))}</b> <span class="muted small">${esc(nUnit(k))}</span></div>
      <select class="inp" style="width:auto;min-height:36px;padding:6px 8px" data-gm>${['','max','min','range'].map(m => `<option value="${m}" ${g.mode===m?'selected':''}>${esc(t('gm_'+(m||'none')))}</option>`).join('')}</select></div>
      ${g.mode ? `<div class="grid2">
        ${g.mode !== 'max' ? `<label class="f" style="margin-top:6px"><span>${esc(t('min'))}</span><input class="inp num" inputmode="decimal" data-gmin value="${esc(inputNum(parseNum(g.min)))}"></label>` : ''}
        ${g.mode !== 'min' ? `<label class="f" style="margin-top:6px"><span>${esc(t('max'))}</span><input class="inp num" inputmode="decimal" data-gmax value="${esc(inputNum(parseNum(g.max)))}"></label>` : ''}
      </div>` : ''}</div>`;
  }
  h += `</div>`;
  // Śledzone składniki
  h += `<div class="card"><div class="fieldset-h" style="margin-top:0">${esc(t('tracked'))}</div><p class="hint" style="margin-top:0">${esc(t('tracked_hint'))}</p>`;
  for (const g of GROUPS.filter(g => g !== 'core' && g !== 'custom')){
    h += `<div class="fieldset-h">${esc(t('grp_'+g))}</div>`;
    for (const n of NUTRIENTS.filter(n => n.g === g)){
      h += `<div class="toggle-row"><span>${esc(nName(n.k))} <span class="muted small">${esc(n.u)}</span></span><input type="checkbox" class="sw-t" data-tr="${n.k}" ${st.tracked.includes(n.k)?'checked':''}></div>`;
    }
  }
  h += `<div class="fieldset-h">${esc(t('grp_custom'))}</div>`;
  for (const c of st.custom){
    h += `<div class="toggle-row"><span class="grow">${esc(c.name)} <span class="muted small">${esc(c.unit)}</span></span>
      <button class="btn small danger" data-cdel="${esc(c.k)}">${esc(t('delete'))}</button>
      <input type="checkbox" class="sw-t" data-tr="${esc(c.k)}" ${st.tracked.includes(c.k)?'checked':''}></div>`;
  }
  h += `<form class="row" data-cadd style="margin-top:10px"><input class="inp grow" name="name" placeholder="${esc(t('custom_name'))}" required><input class="inp" style="width:84px" name="unit" placeholder="${esc(t('unit'))}" value="mg" required><button class="btn" type="submit">${IC.plus}</button></form>
    <p class="hint">${esc(t('custom_hint'))}</p></div>`;
  // Typy posiłków
  h += `<div class="card"><div class="fieldset-h" style="margin-top:0">${esc(t('meal_types'))}</div>`;
  st.mealTypes.forEach((m, i) => {
    h += `<div class="row" style="margin-top:8px"><input class="inp grow" data-mt="${i}" value="${esc(m.name || mealTypeName(m.id))}">
      <button class="iconbtn" data-mup="${i}" ${i===0?'disabled':''} aria-label="↑" style="transform:rotate(90deg)">${IC.left}</button>
      <button class="iconbtn" data-mdel="${i}" ${st.mealTypes.length<=1?'disabled':''} aria-label="${esc(t('delete'))}">${IC.close}</button></div>`;
  });
  h += `<button class="btn small" style="margin-top:10px" data-madd>${IC.plus} ${esc(t('add_meal_type'))}</button>
    <p class="hint">${esc(t('meal_types_hint'))}</p></div>`;
  // Dane
  h += `<div class="card"><div class="fieldset-h" style="margin-top:0">${esc(t('data'))}</div>
    <div class="row wrap"><button class="btn small" data-exj>${esc(t('export_json'))}</button><button class="btn small" data-exc>${esc(t('export_csv'))}</button></div>
    <p class="hint">${esc(t('export_hint'))}</p></div>`;
  // Admin
  if (S.isAdmin){
    h += `<div class="card"><div class="fieldset-h" style="margin-top:0">${esc(t('admin'))}</div>
      ${S.profiles.map(p => `<div class="list-item"><div class="grow"><div class="t">${esc(p.display_name || p.email)}${p.is_admin ? ' <span class="tag shared">admin</span>' : ''}</div><div class="s">${esc(p.email || '')}</div></div>
        <button class="btn small" data-viewu="${esc(p.id)}">${esc(t('view_diary'))}</button></div>`).join('')}
      <p class="hint">${esc(t('admin_add_hint'))}</p></div>`;
  }
  if (S.api.demo){
    h += `<div class="card"><div class="fieldset-h" style="margin-top:0">Demo</div><button class="btn small danger" data-dreset>${esc(t('demo_reset'))}</button></div>`;
  }
  h += `<p class="hint" style="text-align:center;margin:20px 0">${esc(t('app_name'))} · v1.0 · ${esc(t('kcal_rule'))}</p>`;
  v.innerHTML = h;

  bindWeightCard(v, st, false);
  $('[data-ul]',v).onchange=e=>{st.upperWarnings=e.target.checked;saveSettings();};
  // --- zdarzenia
  $('[data-dn]', v).onchange = async e => {
    try { S.profile = await S.api.updateProfile(S.me.id, {display_name: e.target.value.trim()}); toast(t('saved')); } catch(err){ toast(errMsg(err), true); }
  };
  $('[data-pw]', v).onclick = openChangePassword;
  $('[data-out]', v).onclick = () => S.api.signOut();
  $$('[data-lang]', v).forEach(b => b.onclick = () => {
    S.lang = b.dataset.lang; st.lang = S.lang; try { localStorage.setItem('lk_lang', S.lang); } catch(e){}
    applyTheme(); saveSettings(); renderShell(); S.tab = 'set'; renderView();
  });
  $$('[data-theme]', v).forEach(b => b.onclick = () => { st.theme = b.dataset.theme; applyTheme(); saveSettings(); renderSettings(); });
  $$('[data-goal]', v).forEach(row => {
    const k = row.dataset.goal;
    $('[data-gm]', row).onchange = e => {
      const m = e.target.value;
      if (!m) delete st.goals[k];
      else {
        const old = st.goals[k] || {};
        st.goals[k] = {mode:m, min: old.min ?? null, max: old.max ?? null};
      }
      saveSettings(); renderSettings();
    };
    const mi = $('[data-gmin]', row), ma = $('[data-gmax]', row);
    mi && (mi.oninput = () => { st.goals[k].min = parseNum(mi.value); saveSettings(); });
    ma && (ma.oninput = () => { st.goals[k].max = parseNum(ma.value); saveSettings(); });
  });
  $$('[data-tr]', v).forEach(cb => cb.onchange = () => {
    const k = cb.dataset.tr;
    st.tracked = cb.checked ? [...new Set([...st.tracked, k])] : st.tracked.filter(x => x !== k);
    if (cb.checked && !st.goals[k] && NUT_BY_KEY[k] && ['salt','sugar','sat','trans','fiber'].includes(k)){
      // sensowny tryb domyślny (bez wartości – użytkownik je wpisuje)
      st.goals[k] = {mode: NUT_BY_KEY[k].def, min:null, max:null};
    }
    saveSettings(); renderSettings();
  });
  $('[data-cadd]', v).onsubmit = e => {
    e.preventDefault();
    const name = e.target.name.value.trim(), unit = e.target.unit.value.trim();
    if (!name) return;
    const k = 'c_' + uid().replace(/-/g,'').slice(0, 8);
    st.custom.push({k, name, unit});
    st.tracked.push(k);
    saveSettings(); renderSettings();
  };
  $$('[data-cdel]', v).forEach(b => b.onclick = async () => {
    const k = b.dataset.cdel;
    if (!await askConfirm(t('confirm_delete_custom'), t('delete'), true)) return;
    st.custom = st.custom.filter(c => c.k !== k); st.tracked = st.tracked.filter(x => x !== k); delete st.goals[k];
    saveSettings(); renderSettings();
  });
  $$('[data-mt]', v).forEach(inp => inp.onchange = () => {
    const m = st.mealTypes[Number(inp.dataset.mt)];
    const val = inp.value.trim();
    const def = I18N.pl['meal_'+m.id] ? t('meal_'+m.id) : null;
    m.name = (!val || val === def) ? null : val;
    if (!m.name && !def) m.name = val || m.id;
    saveSettings();
  });
  $$('[data-mup]', v).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.mup); if (i < 1) return;
    const a = st.mealTypes; [a[i-1], a[i]] = [a[i], a[i-1]]; saveSettings(); renderSettings();
  });
  $$('[data-mdel]', v).forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.mdel);
    if (!await askConfirm(t('confirm_delete_mt'), t('delete'), true)) return;
    st.mealTypes.splice(i, 1); saveSettings(); renderSettings();
  });
  $('[data-madd]', v).onclick = () => { st.mealTypes.push({id:'mt_'+uid().slice(0,6), name:t('new_meal_type')}); saveSettings(); renderSettings(); };
  $('[data-exj]', v).onclick = exportJson;
  $('[data-exc]', v).onclick = exportCsv;
  $$('[data-viewu]', v).forEach(b => b.onclick = async () => { S.tab = 'day'; await switchView(b.dataset.viewu); renderView(); });
  const dr = $('[data-dreset]', v);
  dr && (dr.onclick = async () => { if (await askConfirm(t('demo_reset')+'?', t('ok'), true)){ S.api.reset(); location.reload(); } });
}

function openChangePassword(){
  const sh = openSheet({title: t('change_pw')});
  sh.body.innerHTML = `<label class="f"><span>${esc(t('new_pw'))}</span><input class="inp" type="password" data-p1 autocomplete="new-password" minlength="8"></label>
    <label class="f"><span>${esc(t('repeat_pw'))}</span><input class="inp" type="password" data-p2 autocomplete="new-password"></label><p class="hint">${esc(t('pw_rule'))}</p>`;
  sh.foot.innerHTML = `<button class="btn" data-c>${esc(t('cancel'))}</button><button class="btn primary" data-ok>${esc(t('save'))}</button>`;
  $('[data-c]', sh.foot).onclick = () => sh.close();
  $('[data-ok]', sh.foot).onclick = async () => {
    const a = $('[data-p1]', sh.body).value, b = $('[data-p2]', sh.body).value;
    if (a.length < 8) return toast(t('pw_rule'), true);
    if (a !== b) return toast(t('pw_mismatch'), true);
    try { await S.api.updatePassword(a); sh.close(); toast(t('pw_changed')); } catch(err){ toast(errMsg(err), true); }
  };
}

function download(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function exportJson(){
  try {
    const meals = await S.api.allMeals(S.me.id);
    const foods = S.foods.filter(f => f.owner === S.me.id);
    const shopping = {private:await S.api.listShopping(false),family:await S.api.listShopping(true)};
    download(`licznik-kcal_${todayIso()}.json`, JSON.stringify({exported_at: new Date().toISOString(), email: S.me.email, settings: S.settings, foods, meals, shopping}, null, 2), 'application/json');
  } catch(err){ toast(errMsg(err), true); }
}
async function exportCsv(){
  try {
    const meals = (await S.api.allMeals(S.me.id)).filter(m => m.status === 'eaten');
    const keys = visibleNutrients();
    const byDay = {};
    for (const m of meals){ byDay[m.day] = sumInto(byDay[m.day] || {}, mealTotals(m)); }
    const sep = S.lang === 'en' ? ',' : ';';
    const num = v => isNum(v) ? (S.lang === 'en' ? String(+v.toFixed(2)) : String(+v.toFixed(2)).replace('.', ',')) : '';
    const head = [t('date'), ...keys.map(k => `${nName(k)} [${nUnit(k)}]`)];
    const rows = Object.keys(byDay).sort().map(d => [d, ...keys.map(k => num(byDay[d][k]))]);
    const csv = '﻿' + [head, ...rows].map(r => r.map(c => (c.includes(sep) || /["\n]/.test(c)) ? '"'+c.replace(/"/g,'""')+'"' : c).join(sep)).join('\n');
    download(`licznik-kcal_${todayIso()}.csv`, csv, 'text/csv;charset=utf-8');
  } catch(err){ toast(errMsg(err), true); }
}

boot();
